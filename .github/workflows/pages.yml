# Deploys the game to GitHub Pages on every push to main.
#
# The site is fully static (no build step), so the deploy is just an
# upload of the repo root. Tests gate the deploy: a broken engine never
# ships. One-time setup in the repo settings: Pages -> Source -> "GitHub
# Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# The default for every job is to read the code and nothing else. A job
# that lists its own permissions replaces this block instead of adding to
# it, which is why the deploy job repeats contents: read.
permissions:
  contents: read

# One deploy at a time, and a deploy that has started always finishes.
# Cancelling one partway gained nothing: if the run that cancelled it
# then failed its tests, or was a manual run from a branch that may not
# deploy, the commit it stopped never went live. A run that arrives
# during a deploy now waits instead. If several pile up, only the newest
# keeps waiting and the ones in between are skipped, because the newest
# commit is the one that should end up live.
#
# This stays at workflow level rather than on the deploy job, so a whole
# run joins the queue as soon as it starts. Per job, a deploy would only
# join after its own tests passed, and an older commit whose tests ran
# slower could deploy after a newer one and roll the site back.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    # Same cap as the PR tests job in test.yml. The suites take seconds and
    # node --test has no time limit of its own; without a cap, a test stuck
    # in a loop would hold up every deploy behind it for six hours.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node --test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    # deploy-pages gives up on its own after 10 minutes and cancels the
    # deployment cleanly. This cap sits above that so the clean cancel
    # always fires first; it only catches a step that hangs outright.
    timeout-minutes: 15
    # Only this job talks to Pages, so only it gets the write scopes; the
    # test job runs repo code and never needs them. checkout needs
    # contents: read, and the upload step packages what it checked out.
    # configure-pages reads the site's settings and deploy-pages creates
    # the deployment, both under pages: write. deploy-pages also needs
    # id-token: write to request the token that proves to Pages the
    # deploy came from this repository's workflow.
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
